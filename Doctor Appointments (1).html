<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doctor Appointments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#eaf4fb;--bg2:#f6f1fc;color-scheme:light;--ink:#13202b;--mute:#5d6b78;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.72);--edge:rgba(255,255,255,.8);--hi:rgba(255,255,255,.9);--shadow:rgba(60,90,130,.22);--teal:#0e9488;--indigo:#5667ff;--amber:#d97706;--o1:#bae6fd;--o2:#ddd6fe;--o3:#a7f3d0;--px:0;--py:0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.7;pointer-events:none;z-index:0;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.orb.a{width:46vmax;height:46vmax;background:var(--o1);top:-14vmax;left:-12vmax;transform:translate3d(calc(var(--px)*-40px),calc(var(--py)*-40px),0)}
.orb.b{width:38vmax;height:38vmax;background:var(--o2);right:-12vmax;top:18vh;transform:translate3d(calc(var(--px)*70px),calc(var(--py)*60px),0)}
.orb.c{width:30vmax;height:30vmax;background:var(--o3);bottom:-12vmax;left:25vw;transform:translate3d(calc(var(--px)*-100px),calc(var(--py)*-80px),0)}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:40px 16px 72px}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 28px;max-width:46ch}
.stage{perspective:1100px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 40px 70px -28px var(--shadow),0 10px 24px -10px var(--shadow);position:relative}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),var(--hi),transparent 60%);opacity:var(--sheen,0);transition:opacity .3s}
.tilt{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(var(--z,0px));transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;will-change:transform}
.tilt.live{transition:transform .08s linear}
.panel{border-radius:26px;padding:18px;display:flex;gap:14px;flex-wrap:wrap;align-items:end;transform-style:preserve-3d}
.field{flex:1 1 260px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 6px 4px}
select{width:100%;padding:13px 14px;font:inherit;font-weight:600;color:var(--ink);background:var(--glass2);border:1px solid var(--edge);border-radius:16px;box-shadow:inset 0 1px 0 var(--hi)}
select option{background:#fff;color:#13202b;font-weight:500}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
.go{padding:13px 24px;font-weight:700;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--indigo));box-shadow:0 12px 24px -8px rgba(60,90,220,.55),inset 0 1px 0 rgba(255,255,255,.5);transform:translateZ(30px);transition:transform .2s,filter .2s,opacity .2s}
.go:hover:not(:disabled){transform:translateZ(46px) scale(1.03)}
.go:active:not(:disabled){transform:translateZ(14px) scale(.97)}
.go:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
#result{margin-top:28px;perspective:1400px}
.head{border-radius:26px;padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.avatar,.pv{overflow:hidden;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:22px;color:#fff;background:radial-gradient(circle at 30% 25%,#fff8,transparent 40%),linear-gradient(135deg,var(--teal),var(--indigo));box-shadow:0 14px 26px -8px rgba(60,90,220,.6);transform:translateZ(40px)}
.avatar{width:92px;height:92px}
.pv{width:56px;height:56px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--teal),var(--indigo));box-shadow:0 10px 20px -6px rgba(60,90,220,.55);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.pv[hidden]{display:none}
.avatar img,.pv img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(10px)}to{opacity:1;transform:none}}
.who{flex:1 1 200px}
.who h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.who p{margin:0;color:var(--mute)}
.stats{display:flex;gap:10px}
.stat{padding:8px 16px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge);text-align:center;transform:translateZ(24px)}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.stat span{font-size:12px;color:var(--mute)}
.seg{position:relative;display:inline-grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:16px;margin-bottom:18px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:var(--glass2);box-shadow:0 6px 14px -4px var(--shadow),inset 0 1px 0 var(--hi);transform:translateX(calc(var(--i,0)*100%));transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.seg button{position:relative;padding:7px 22px;font-weight:600;font-size:14px;border-radius:12px;color:var(--mute)}
.seg button.on{color:var(--ink)}
.list{display:grid;gap:12px;perspective:1400px}
.wrap{animation:fly .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.wrap.still{animation:none}
@keyframes fly{from{opacity:0;transform:translate3d(0,50px,-260px) rotateX(26deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translate3d(0,30px,-120px) rotateX(14deg)}to{opacity:1;transform:none}}
.card{border-radius:20px;padding:14px 18px;display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;transform-style:preserve-3d}
.date{text-align:center;line-height:1.1;transform:translateZ(28px)}
.date b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em}
.date span{font-size:12px;color:var(--mute);font-weight:600}
.info{min-width:0;transform:translateZ(16px)}
.info strong{display:block;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{color:var(--mute);font-size:13px}
.meta{text-align:right;display:grid;gap:4px;justify-items:end;transform:translateZ(22px)}
.tag{padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,transparent)}
.tag.ipd{color:var(--amber);background:color-mix(in srgb,var(--amber) 18%,transparent)}
.meta small{color:var(--mute);font-size:12px}
.empty{padding:44px;text-align:center;color:var(--mute);border-radius:22px}
.more{text-align:center;margin-top:22px}
.more button{padding:11px 22px;font-weight:700;border-radius:16px;color:var(--teal)}
@media (max-width:560px){.card{grid-template-columns:52px 1fr;}.meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tilt{transform:none!important}.orb{transform:none!important}}
</style>
</head>

  <p class="sub">Choose a doctor to see every past OPD visit and IPD admission.</p>

      </div>
      <button class="go" id="go" disabled>Show Past Appointments</button>
    </div>
  </div>

  <div id="result" aria-live="polite"></div>
</main>

const PAGE = 30, MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const sel = document.getElementById('doc'), go = document.getElementById('go'), out = document.getElementById('result');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches, fine = matchMedia('(pointer:fine)').matches;
let current = [], filter = 'All', shown = PAGE, docName = '';

const counts = {};
ROWS.forEach(r => counts[r[0]] = (counts[r[0]] || 0) + 1);
DOCTORS.map((n, i) => ({n, i})).sort((a, b) => a.n.localeCompare(b.n)).forEach(d => {
  const o = document.createElement('option');
  o.value = d.i; o.textContent = d.n + ' (' + (counts[d.i] || 0) + ')';
  sel.appendChild(o);
});
const initials = n => n.replace(/^Dr\.? /, '').split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
function face(node, name) { node.replaceChildren(); if (PHOTOS[name]) node.append(el('img', {src: PHOTOS[name], alt: name})); else node.textContent = initials(name); return node; }
sel.onchange = () => {
  go.disabled = sel.value === '';
  const pv = document.getElementById('pv'); pv.hidden = sel.value === '';
  if (sel.value !== '') { face(pv, DOCTORS[+sel.value]); pv.style.animation = 'none'; pv.offsetWidth; pv.style.animation = ''; }
};
go.onclick = () => {
  const idx = Number(sel.value); docName = DOCTORS[idx];
  const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
  current = ROWS.filter(r => r[0] === idx && r[1] <= now).sort((a, b) => b[1].localeCompare(a[1]));
  filter = 'All'; shown = PAGE; render(0, true);
  out.scrollIntoView({behavior: still ? 'auto' : 'smooth', block: 'start'});
};

const el = (t, p, ...k) => { const e = document.createElement(t); p = Object.assign({}, p); if (p.dataset) { Object.assign(e.dataset, p.dataset); delete p.dataset; } Object.assign(e, p); k.forEach(x => e.append(x)); return e; };
function countUp(node, to) {
  if (still || !to) { node.textContent = to; return; }
  const t0 = performance.now();
  (function f(t) { const p = Math.min(1, (t - t0) / 700); node.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); })(t0);
}

function render(from, full) {
  const list = filter === 'All' ? current : current.filter(r => r[6] === filter);
  if (full) {
    out.replaceChildren();
    const opd = current.filter(r => r[6] === 'OPD').length, ipd = current.length - opd;
    const nums = [current.length, opd, ipd].map(() => el('b'));
    const stats = el('div', {className: 'stats'}, ...['Total', 'OPD', 'IPD'].map((l, i) => el('div', {className: 'stat'}, nums[i], el('span', {textContent: l}))));
    out.append(el('div', {className: 'head glass tilt', dataset: {tilt: 4}},
      face(el('div', {className: 'avatar'}), docName),
      el('div', {className: 'who'}, el('h2', {textContent: 'Dr. ' + docName.replace(/^Dr\.? /, '')}), el('p', {textContent: 'Past appointments, newest first'})), stats));
    [current.length, opd, ipd].forEach((n, i) => countUp(nums[i], n));
    const seg = el('div', {className: 'seg', role: 'tablist'}, el('i'));
    ['All', 'OPD', 'IPD'].forEach((f, i) => {
      const b = el('button', {className: f === filter ? 'on' : '', textContent: f, role: 'tab'});
      b.onclick = () => { filter = f; shown = PAGE; seg.style.setProperty('--i', i); seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(0, false); };
      seg.append(b);
    });
    out.append(seg, el('div', {id: 'items'}), el('div', {className: 'more', id: 'more'}));
  }
  const box = document.getElementById('items'), more = document.getElementById('more');
  if (from === 0) box.replaceChildren();
  if (!list.length) { box.replaceChildren(el('div', {className: 'empty glass', textContent: 'No ' + (filter === 'All' ? '' : filter + ' ') + 'appointments found for this doctor.'})); more.replaceChildren(); return; }
  let g = box.firstChild; if (!g || g.className !== 'list') { box.replaceChildren(g = el('div', {className: 'list'})); }
  list.slice(from, shown).forEach((r, i) => {
    const d = r[1], time = new Date(d.replace(' ', 'T')).toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit', hour12: true});
    const card = el('div', {className: 'card glass tilt', dataset: {tilt: 7}},
      el('div', {className: 'date'}, el('b', {textContent: d.slice(8, 10)}), el('span', {textContent: MON[+d.slice(5, 7) - 1] + ' ' + d.slice(0, 4)})),
      el('div', {className: 'info'}, el('strong', {textContent: r[2]}), el('small', {textContent: r[3] + ' · ' + ([r[4], r[5]].filter(Boolean).join(' / ') || 'age n/a')})),
      el('div', {className: 'meta'}, el('span', {className: 'tag' + (r[6] === 'IPD' ? ' ipd' : ''), textContent: r[6]}), el('small', {textContent: time + ' · ' + r[7]})));
    const w = el('div', {className: 'wrap'}, card);
    w.style.setProperty('--d', Math.min(i, 12) * 55 + 'ms');
    g.append(w);
  });
  more.replaceChildren();
  if (list.length > shown) {
    const m = el('button', {className: 'glass tilt', dataset: {tilt: 8}, textContent: 'Show more (' + (list.length - shown) + ' remaining)'});
    m.style.borderRadius = '16px'; m.style.color = 'var(--teal)'; m.style.padding = '11px 22px'; m.style.fontWeight = 700;
    m.onclick = () => { const prev = shown; shown += PAGE; render(prev, false); };
    more.append(m);
  }
}

/* Spatial effects: pointer-driven tilt + sheen on any .tilt element, parallax on the background orbs */
if (!still && fine) {
  const root = document.documentElement;
  addEventListener('pointermove', e => {
    root.style.setProperty('--px', (e.clientX / innerWidth - .5).toFixed(3));
    root.style.setProperty('--py', (e.clientY / innerHeight - .5).toFixed(3));
    const t = e.target.closest && e.target.closest('.tilt');
    document.querySelectorAll('.tilt.live').forEach(n => { if (n !== t) reset(n); });
    if (!t) return;
    const r = t.getBoundingClientRect(), max = +t.dataset.tilt || 6;
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    t.classList.add('live');
    t.style.setProperty('--ry', ((x - .5) * max * 2).toFixed(2) + 'deg');
    t.style.setProperty('--rx', ((.5 - y) * max * 2).toFixed(2) + 'deg');
    t.style.setProperty('--z', '14px');
    t.style.setProperty('--mx', x * 100 + '%'); t.style.setProperty('--my', y * 100 + '%'); t.style.setProperty('--sheen', 1);
  }, {passive: true});
  document.addEventListener('pointerleave', () => document.querySelectorAll('.tilt.live').forEach(reset));
  function reset(n) { n.classList.remove('live'); ['--rx', '--ry', '--z'].forEach(p => n.style.removeProperty(p)); n.style.setProperty('--sheen', 0); }
}
</script>
